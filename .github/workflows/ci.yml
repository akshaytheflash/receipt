name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: rustup update stable && rustup default stable

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: build
        run: cargo build --release

      - name: smoke
        run: |
          .\target\release\receipt.exe --version
          .\target\release\receipt.exe run --json --timeout 60 -- .\target\release\fixture_installer.exe "$env:TEMP\receipt-ci" | Out-File -Encoding utf8 session.json
          .\target\release\receipt.exe list
          .\target\release\receipt.exe revert --yes
